# 検索品質の評価用質問セット（#39）
# 利用者が実際に入力しそうな言い方（口語・制度名を知らない言い方・表記ゆれ）で書く。
#
# expect: 正解とみなす案内先（いずれか1つが上位に入れば正解）
#   programs / documents / faqs: data/seed のコード
#   contacts: 窓口のコード（窓口ブロックに含まれれば正解）
# as:      検索するユーザー（省略時は一般社員 sato@example.com）
# fallback: true のとき、結果がなくても総合窓口（HR-REP）が案内されることを確認する
# tags:    集計の切り口（life-event = 状況から / colloquial = 口語 / no-name = 制度名を知らない / variant = 表記ゆれ / ...）
#
# 評価の指標は data/eval/README.md を参照。

# ---------------------------------------------------------------- 結婚・慶弔
- id: Q001
