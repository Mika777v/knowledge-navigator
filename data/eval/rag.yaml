# 根拠付き回答（RAG）の評価用質問セット（E14-T6・ADR-0013）
# 回答文が、正しい条を引用し、条文の数値を写し間違えずに書けているかを測る。
#
# answerable: false のとき、規程に記載がなく「回答できない」と答えるべき質問（窓口の案内だけを出す）
# expect.sections: 引用してほしい条（{document: 文書のコード, article: 第N条}）。いずれか1つを引用すれば正解
# expect.facts:    回答に含まれるべき数値・語。expect.sections のどれかの本文に、同じ書き方で含まれていること（validate_seed.py で検査）
# as:      質問するユーザー（省略時は一般社員 sato@example.com）
# tags:    集計の切り口（data/eval/README.md の「RAG の質問セット」）
#
# 評価の指標と実行方法は data/eval/README.md を参照。

# ---------------------------------------------------------------- 慶弔
- id: R001
  q: 結婚したらお祝い金はいくらもらえますか？
  expect:
    sections: [{ document: REG-GA-001, article: 第5条 }]
