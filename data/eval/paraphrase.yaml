# 言い換えの評価用質問セット（E13-T7）
# 制度名・キーワード・類義語辞書・FAQ の言い方を**使わずに**、同じことを別の言葉で聞く質問。
# キーワード検索だけでは当たりにくい質問で、意味検索（ベクトル検索、ADR-0007）の効果を測る。
# v0.4.0 の目標: キーワード検索だけのとき（baseline-paraphrase.json）より Hit@5 が 10 ポイント上がること。
#
# 書き方は questions.yaml と同じ（data/eval/README.md）。ID は P001〜。tags には必ず paraphrase を付ける。
# 新しい質問は、data/seed の keywords・synonyms・faqs の言い方と重ならないように書く。

# ---------------------------------------------------------------- 結婚・慶弔
- id: P001
  q: 籍を入れることになりました
  expect: { programs: [PRG-MARRIAGE-GIFT, PRG-MARRIAGE-LEAVE] }
  tags: [paraphrase, life-event]
