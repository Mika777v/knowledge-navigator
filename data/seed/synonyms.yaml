# 類義語辞書（E12-T2・PRD F-301）。同じグループの語は、どれも同じ意味として検索を広げる。
#
# canonical: 代表の語（規程・制度で使っている正式な言い方）
# terms:     同じ意味の言い方（略語・言い換え・表記ゆれ）。1つの語は1つのグループにだけ入れる
#
# 制度・きっかけへの直接の案内（「入籍」→ 結婚）は、ここではなく programs.yaml・life_events.yaml の keywords に書く。
# 類義語は全文検索（FAQ の質問文・条文）にも効くため、意味の広すぎる語（「車」「休み」など）は入れない。

# ---------------------------------------------------------------- 休暇・休業
- canonical: 育児休業
  terms: [育休, 育児休暇]
- canonical: 産前産後休業
  terms: [産休, 産前産後休暇]
- canonical: 年次有給休暇
  terms: [有給休暇, 有給, 有休, 年休]
- canonical: 忌引休暇
  terms: [忌引, 忌引き]
- canonical: 復職
  terms: [職場復帰, 育休明け, 休業明け]

# ---------------------------------------------------------------- 働き方
- canonical: 在宅勤務
  terms: [テレワーク, リモートワーク, 在宅ワーク, リモート勤務]
- canonical: 短時間勤務
  terms: [時短勤務, 時短]
- canonical: 自家用車通勤
  terms: [マイカー通勤, 車通勤, 車で通勤]

# ---------------------------------------------------------------- 暮らし・お金
- canonical: 引越し
  terms: [引っ越し, 引越, 転居]
- canonical: 給与
  terms: [給料, 賃金, 月給]

# ---------------------------------------------------------------- IT・セキュリティ
- canonical: PC
  terms: [パソコン, ノートパソコン, ノートPC]
- canonical: スマートフォン
  terms: [スマホ, 携帯電話, 社用携帯]
- canonical: 不審なメール
  terms: [フィッシングメール, 迷惑メール, 怪しいメール]

# ---------------------------------------------------------------- 相談
- canonical: パワーハラスメント
  terms: [パワハラ]
- canonical: セクシュアルハラスメント
  terms: [セクハラ, セクシャルハラスメント]
- canonical: メンタルヘルス
  terms: [メンタル, 心の健康, メンタル不調]
