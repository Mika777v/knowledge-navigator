- code: PRG-CHILDCARE-LEAVE
  name: 育児休業
  name_kana: いくじきゅうぎょう
  summary: 1歳未満の子を育てるための休業。2回まで分割でき、保育所に入れない場合などは最長2歳まで延長できる。
  eligibility: 1歳未満の子を養育する社員（契約社員は、子が1歳6か月になるまでに契約が満了することが明らかでない場合）
  benefit: 原則として子が1歳になるまで（2回まで分割可）
  how_to_apply: 人事システムの「育児休業申出書」で申し出る。
  deadline_note: 原則として休業開始予定日の1か月前まで
  required_documents: 育児休業申出書
  category: hr-leave
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-002, article: 第4条 }
    - { document: REG-HR-002, article: 第5条 }
    - { document: REG-HR-002, article: 第6条 }
  contacts:
    - { contact: HR-LABOR, role: APPLY }
  keywords: [育休, 育児休暇, 育児休業, 子育て, 育児, 保育園に入れない]

- code: PRG-PATERNITY-LEAVE
  name: 産後パパ育休（出生時育児休業）
  name_kana: さんごぱぱいくきゅう
  summary: 子の出生後8週間以内に、最大4週間取得できる休業。通常の育児休業とは別に取得できる。
  eligibility: 子の出生後8週間以内の子を養育する社員
  benefit: 4週間（28日）まで、2回まで分割可
  how_to_apply: 人事システムの「育児休業申出書」で出生時育児休業として申し出る。
  deadline_note: 原則として休業開始予定日の2週間前まで
  category: hr-leave
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-002, article: 第7条 }
  contacts:
    - { contact: HR-LABOR, role: APPLY }
  keywords: [産後パパ育休, パパ育休, 男性育休, 出生時育児休業, 父親, 育休]

- code: PRG-CHILD-NURSING-LEAVE
  name: 子の看護等休暇
  name_kana: こかんごとうきゅうか
  summary: 子どもの病気・予防接種・学級閉鎖・入園式などのための有給の休暇。時間単位で取得できる。
  eligibility: 小学校3年生修了までの子を養育する社員
  benefit: 子1人は年5日、2人以上は年10日（有給、時間単位可）
  how_to_apply: 勤怠システムで「子の看護等休暇」を申請する。当日の申請でもよい。
  category: hr-leave
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-002, article: 第12条 }
  contacts:
    - { contact: HR-LABOR, role: INQUIRY }
  keywords: [看護休暇, 子供の病気, 子どもが熱, 学級閉鎖, 入学式, 入園式, 卒園式, 予防接種]

- code: PRG-CARE-LEAVE
  name: 介護休業
  name_kana: かいごきゅうぎょう
  summary: 要介護状態の家族を介護するための休業。対象家族1人につき通算93日、3回まで分割できる。
  eligibility: 要介護状態にある家族を介護する社員
  benefit: 対象家族1人につき通算93日まで（3回まで分割可）
  how_to_apply: 人事システムの「介護休業申出書」で申し出る。
  deadline_note: 原則として休業開始予定日の2週間前まで
  category: hr-leave
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-002, article: 第10条 }
  contacts:
    - { contact: HR-LABOR, role: APPLY }
  keywords: [介護, 介護休暇, 親の介護, 要介護, 介護休業]

- code: PRG-CARE-DAYS
  name: 介護休暇
  name_kana: かいごきゅうか
  summary: 家族の通院の付き添いや介護サービスの手続きなどのための有給の休暇。時間単位で取得できる。
  eligibility: 要介護状態にある家族の介護や世話を行う社員
  benefit: 対象家族1人は年5日、2人以上は年10日（有給、時間単位可）
  how_to_apply: 勤怠システムで「介護休暇」を申請する。
  category: hr-leave
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-002, article: 第13条 }
  contacts:
    - { contact: HR-LABOR, role: INQUIRY }
  keywords: [介護, 通院の付き添い, 通院に付き添う, ケアマネ, 介護休暇]

- code: PRG-CHILDCARE-SHORT-HOURS
  name: 育児短時間勤務
  name_kana: いくじたんじかんきんむ
  summary: 3歳未満の子を育てる社員が、1日の所定労働時間を6時間にできる制度。
  eligibility: 3歳に満たない子を養育する社員
  benefit: 1日6時間勤務
  how_to_apply: 人事システムで申し出て、始業・終業時刻を所属長と相談して決める。
  category: hr-work
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-002, article: 第16条 }
  contacts:
    - { contact: HR-LABOR, role: APPLY }
  keywords: [時短, 時短勤務, 短時間勤務, 6時間勤務, 保育園のお迎え]

- code: PRG-OVERTIME-EXEMPTION
  name: 残業免除・時間外労働の制限
  name_kana: ざんぎょうめんじょ
  summary: 小学校就学前の子の養育や家族の介護をする社員が、残業や深夜業の制限を請求できる制度。
  eligibility: 小学校就学前の子を養育する社員、要介護状態の家族を介護する社員
  benefit: 所定外労働の免除、時間外労働を月24時間・年150時間以内に制限、深夜業の免除
