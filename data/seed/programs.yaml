  name: 人間ドック補助
  name_kana: にんげんどっくほじょ
  summary: 35歳以上の社員が人間ドックを受けたときの費用補助。定期健康診断の代わりになる。
  eligibility: 満35歳以上の正社員・契約社員
  benefit: 1年度に1回、30,000円まで
  how_to_apply: 社内ポータルの「健康補助申請」から領収書を添付して申請する。
  deadline_note: 受診後3か月以内
  required_documents: 領収書
  category: welfare
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-005, article: 第7条 }
  contacts:
    - { contact: HR-HEALTH, role: INQUIRY }
  keywords: [人間ドック, 健康診断, 健診, 検診]

- code: PRG-QUALIFICATION-AWARD
  name: 資格取得奨励金・研修補助
  name_kana: しかくしゅとくしょうれいきん
  summary: 会社が指定する資格を取ったときの奨励金と、通信教育・外部研修の受講料補助。
  eligibility: 正社員・契約社員
  benefit: 資格ごとの奨励金、通信教育・外部研修は受講料の2分の1（年50,000円まで）
  how_to_apply: 合格通知・修了証を添えて人事部 採用・研修グループに申請する。
  deadline_note: 合格通知を受けた日から3か月以内
  category: welfare
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-005, article: 第10条 }
    - { document: REG-HR-005, article: 第11条 }
  contacts:
    - { contact: HR-HIRE, role: APPLY }
  keywords: [資格, 資格取得, 奨励金, 通信教育, 研修, 自己啓発, 受験]

- code: PRG-CARE-SERVICE-AID
  name: ベビーシッター・介護サービスの利用補助
  name_kana: べびーしったーほじょ
  summary: 会社の契約するベビーシッター・介護サービスを利用したときの補助。
  eligibility: 小学校就学前の子を養育する社員、要介護状態の家族を介護する社員
  benefit: 1回2,000円（1か月10回まで）
  how_to_apply: 利用月の翌月10日までに人事部 労務グループに申請する。
  deadline_note: 利用月の翌月10日まで
  category: welfare
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-005, article: 第12条 }
  contacts:
    - { contact: HR-LABOR, role: APPLY }
