# =====================================================================
- code: PRG-HOUSING-ALLOWANCE
  name: 住宅手当
  name_kana: じゅうたくてあて
  summary: 世帯主として賃貸住宅を契約している正社員に支給される手当。
  eligibility: 世帯主として賃貸住宅を契約している正社員
  benefit: 月額20,000円
  how_to_apply: 人事システムの「住宅手当申請」に賃貸借契約書の写しを添付して申請する。結婚・転居などで変わったら14日以内に届け出る。
  deadline_note: 変更は14日以内に届出
  required_documents: 賃貸借契約書の写し
  category: welfare
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-005, article: 第5条 }
  contacts:
    - { contact: HR-LABOR, role: APPLY }
  keywords: [住宅手当, 家賃補助, 家賃, 賃貸, 世帯主]

- code: PRG-COMPANY-HOUSING
  name: 社宅
  name_kana: しゃたく
  summary: 会社の命令で転居を伴う異動をした社員が入居できる借り上げ社宅。
  eligibility: 会社の命令により転居を伴う異動をした社員
  benefit: 家賃の80%を会社が負担（入居は原則5年以内）
  how_to_apply: 異動の内示後、総務部 庶務グループに申し込む。
  category: welfare
  owner_department: HR
  visibility: INTERNAL
