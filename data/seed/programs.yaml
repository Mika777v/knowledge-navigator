- code: PRG-MATERNITY-LEAVE
  name: 産前産後休業
  name_kana: さんぜんさんごきゅうぎょう
  summary: 出産前後に取得できる休業。産後8週間は原則として就業できない。
  eligibility: 出産予定の女性社員
  benefit: 産前6週間（多胎妊娠は14週間）、産後8週間
  how_to_apply: 出産予定日がわかったら、人事部 労務グループに申し出る。
