- code: PRG-BEREAVEMENT-LEAVE
  name: 忌引休暇
  name_kana: きびききゅうか
  summary: 家族が亡くなったときに取得できる有給の特別休暇。
  eligibility: 全社員
  benefit: 配偶者・子・父母は5日、祖父母・兄弟姉妹・配偶者の父母は3日
  how_to_apply: 勤怠システムで「特別休暇（忌引）」を申請する。事後の申請でもよい。
