  eligibility: 勤続10年・20年・30年に達した社員
  benefit: 休暇5日と旅行券（10年 30,000円分、20年 50,000円分、30年 100,000円分）
  how_to_apply: 対象者には人事部から通知がある。休暇は勤怠システムで申請する。
