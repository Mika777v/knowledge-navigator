- code: PRG-FLEXIBLE-WORK-CHILDCARE
  name: 育児のための柔軟な働き方（時差出勤・テレワーク）
  name_kana: じゅうなんなはたらきかた
  summary: 3歳から小学校就学前の子を育てる社員が、時差出勤か月10日以上のテレワークを選んで利用できる制度。
  eligibility: 3歳から小学校就学前の子を養育する社員
  benefit: 時差出勤（始業・終業時刻の変更）またはテレワーク（月10日以上・時間単位可）のどちらか1つ
  how_to_apply: 人事部 労務グループに相談のうえ、人事システムで申し出る。
  category: hr-work
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-002, article: 第17条 }
  contacts:
    - { contact: HR-LABOR, role: APPLY }
  keywords: [柔軟な働き方, 時差出勤, テレワーク, 在宅, 保育園の送迎]

- code: PRG-MANAGER-CHILDCARE-SUPPORT
  name: 部下の妊娠・出産・介護の申出への対応（管理職向け）
  name_kana: ぶかのいくじかいごたいおう
  summary: 部下から妊娠・出産・介護の申出を受けた管理職が行う対応（人事への連絡、制度の個別周知、ハラスメントの防止）。
  eligibility: 管理職
  how_to_apply: 申出を受けたら速やかに人事部 労務グループに連絡する。制度の個別周知と意向確認は人事部と一緒に行う。
  category: hr-leave
  owner_department: HR
  visibility: MANAGERS
  basis:
    - { document: REG-HR-002, article: 第3条 }
    - { document: REG-HR-002, article: 第9条 }
    - { document: REG-LEGAL-001, article: 第5条 }
  contacts:
    - { contact: HR-LABOR, role: INQUIRY }
  keywords: [部下, 管理職, 育休の申出, 妊娠の報告, マタハラ]

# =====================================================================
# 働き方（就業規則・在宅勤務規程・通勤手当規程）
# =====================================================================
- code: PRG-REMOTE-WORK
  name: 在宅勤務
  name_kana: ざいたくきんむ
  summary: 自宅などで勤務できる制度。週3日まで（育児・介護の場合は上限なし）。
  eligibility: 試用期間を終えた社員で、所属長が認めた者（育児・介護などの事情があれば試用期間中も可）
  benefit: 週3日まで在宅勤務できる
  how_to_apply: 初回は人事システムの「在宅勤務利用申請」で所属長の承認を得る。以後は前日までに勤怠システムで日ごとに申請する。
  deadline_note: 日ごとの申請は前日の終業時刻まで
  category: hr-work
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-003, article: 第4条 }
    - { document: REG-HR-003, article: 第5条 }
    - { document: REG-HR-003, article: 第7条 }
  contacts:
    - { contact: HR-LABOR, role: APPLY }
  keywords: [在宅, 在宅勤務, テレワーク, リモートワーク, リモート, 家で仕事]

- code: PRG-REMOTE-ALLOWANCE
  name: 在宅勤務手当
  name_kana: ざいたくきんむてあて
  summary: 在宅勤務の通信費・光熱費の補助として支給される手当。
  eligibility: 在宅勤務の登録をし、その月に1日以上在宅勤務をした社員
  benefit: 月額3,000円
  how_to_apply: 在宅勤務の利用登録をすれば申請は不要（翌月の給与と合わせて支給）。
  category: hr-pay
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-003, article: 第12条 }
  contacts:
    - { contact: HR-LABOR, role: INQUIRY }
  keywords: [在宅勤務手当, 通信費, 光熱費, 電気代, ネット代]

- code: PRG-COMMUTE-ALLOWANCE
  name: 通勤手当
  name_kana: つうきんてあて
  summary: 通勤にかかる費用として毎月支給される手当。入社・引越し・経路変更のときは申請が必要。
  eligibility: 通勤距離が片道2km以上の社員（パートタイム社員を含む）
  benefit: 電車・バスは6か月定期代の6分の1（月50,000円まで）。自転車・自家用車は距離に応じた定額
  how_to_apply: 人事システムの「通勤経路申請」に定期券の金額がわかる資料を添付して申請する。
  deadline_note: 事由が発生した日から14日以内（遅れた場合はさかのぼって支給しない）
  category: hr-pay
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-004, article: 第4条 }
    - { document: REG-HR-004, article: 第7条 }
  contacts:
    - { contact: HR-LABOR, role: APPLY }
  keywords: [通勤手当, 交通費, 定期代, 定期券, 通勤経路, 電車代]

- code: PRG-COMMUTE-ACTUAL-COST
  name: 在宅勤務併用時の通勤費の実費精算
  name_kana: つうきんひじっぴせいさん
  summary: 1か月の出社予定が10日以下の社員は、定期代の代わりに出社した日の往復運賃を実費で精算する。
  eligibility: 在宅勤務を併用し、1か月の出社予定日が10日以下の社員
  benefit: 出社した日の往復運賃の実費
  how_to_apply: 経費精算システムで月ごとに申請する。定期代との切り替えは前月20日までに人事部に申請する。
  deadline_note: 切り替えは前月の20日まで
  category: hr-pay
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-004, article: 第8条 }
  contacts:
    - { contact: FIN-EXPENSE, role: APPLY }
    - { contact: HR-LABOR, role: INQUIRY }
  keywords: [実費精算, 出社日の交通費, 在宅勤務の交通費, 定期をやめる]

- code: PRG-PERSONAL-INFO-CHANGE
  name: 氏名・住所・扶養の変更届
  name_kana: しめいじゅうしょへんこう
  summary: 結婚・引越し・出産などで氏名・住所・扶養家族が変わったときの届出。
  eligibility: 全社員
  how_to_apply: 人事システムの「身上異動届」で届け出る。通勤経路が変わる場合は通勤手当の申請も行う。
  deadline_note: 変更の日から14日以内
  category: hr
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-001, article: 第10条 }
  contacts:
    - { contact: HR-LABOR, role: APPLY }
  keywords: [住所変更, 引越し, 引っ越し, 転居, 氏名変更, 名字が変わる, 扶養, 扶養家族, 身上異動]

- code: PRG-TIME-SHIFT
  name: 時差出勤
  name_kana: じさしゅっきん
  summary: 業務や育児・介護の事情に応じて、始業・終業時刻を1時間の範囲で前後にずらせる制度。
  eligibility: 所属長の承認を得た社員
  benefit: 始業・終業時刻を1時間の範囲で繰り上げ・繰り下げ
  how_to_apply: 所属長の承認を得て、勤怠システムで申請する。
  category: hr-work
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-001, article: 第17条 }
  contacts:
    - { contact: HR-LABOR, role: INQUIRY }
  keywords: [時差出勤, 早く帰りたい, 出勤時間をずらす, 始業時間, 満員電車, 通勤ラッシュ]

- code: PRG-RESIGNATION
  name: 退職の手続き
  name_kana: たいしょくのてつづき
  summary: 退職するときの申出の時期と、業務の引き継ぎ・PC や社員証の返却などの手続き。
  eligibility: 退職する社員
  how_to_apply: できるだけ退職日の1か月前までに所属長に申し出る。退職日までに引き継ぎを行い、PC・社員証などを返却する。
  deadline_note: 退職日の1か月前までに申出（目安）
  category: hr
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-001, article: 第39条 }
    - { document: REG-HR-001, article: 第42条 }
    - { document: REG-IT-002, article: 第11条 }
  contacts:
    - { contact: HR-HIRE, role: APPLY }
    - { contact: IT-HELPDESK, role: INQUIRY }
  keywords: [退職, 辞めたい, 退社, 退職届, 引き継ぎ, 返却]

# =====================================================================
