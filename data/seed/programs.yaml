    - { document: REG-HR-005, article: 第14条 }
  contacts:
    - { contact: HR-REP, role: INQUIRY }
  keywords: [勤続, 永年勤続, 10年, 表彰, 記念品, 旅行券]

- code: PRG-ANNUAL-LEAVE
  name: 年次有給休暇
  name_kana: ねんじゆうきゅうきゅうか
  summary: 入社6か月後から付与される有給休暇。勤続年数に応じて日数が増える。
  eligibility: 6か月以上継続勤務し、所定労働日の8割以上出勤した社員
  benefit: 入社6か月で10日、以後1年ごとに増え、6年6か月以上で年20日。翌年度に繰り越し可
  how_to_apply: 原則として前日までに勤怠システムで申請する。
  category: hr-leave
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-001, article: 第25条 }
    - { document: REG-HR-001, article: 第26条 }
    - { document: REG-HR-001, article: 第27条 }
  contacts:
    - { contact: HR-LABOR, role: INQUIRY }
  keywords: [有給, 有休, 年休, 休みたい, 休暇, 有給休暇, 繰り越し]

- code: PRG-HOURLY-LEAVE
  name: 時間単位の年次有給休暇
  name_kana: じかんたんいねんきゅう
  summary: 年次有給休暇を1時間単位で取得できる制度（通院や子どもの送迎などに）。
  eligibility: 年次有給休暇がある社員
  benefit: 1年に5日分まで
