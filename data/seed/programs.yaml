  category: hr-work
  owner_department: HR
  visibility: INTERNAL
  basis:
    - { document: REG-HR-002, article: 第14条 }
    - { document: REG-HR-002, article: 第15条 }
  contacts:
    - { contact: HR-LABOR, role: APPLY }
