# 制度（すべて架空の会社の制度）。ADR-0003
# basis:     根拠の文書（documents の code）と条番号。同じ文書の複数の条を指定できる
# contacts:  窓口（contacts の code）と役割  APPLY=申請先 / INQUIRY=問い合わせ先 / PAYMENT=支給担当
# keywords:  利用者が使いそうな言葉（制度名を知らなくてもヒットさせるため）
# visibility は根拠文書の公開範囲より広くしてはいけない（INTERNAL が最も広い）

# =====================================================================
# 慶弔（慶弔見舞金規程）
# =====================================================================
- code: PRG-MARRIAGE-GIFT
  name: 結婚祝金
  name_kana: けっこんいわいきん
  summary: 社員が結婚したときに会社から支給されるお祝い金。
  eligibility: 勤続6か月以上の正社員・契約社員（パートタイム社員は半額）
  benefit: 30,000円（社員同士の結婚はそれぞれに支給）
  how_to_apply: 社内ポータルの「慶弔申請」から、婚姻を証明する書類を添付して申請する。
  deadline_note: 入籍日から6か月以内
  required_documents: 戸籍謄本または婚姻届受理証明書の写し
  category: welfare-ceremony
  owner_department: GA
  visibility: INTERNAL
  basis:
    - { document: REG-GA-001, article: 第5条 }
    - { document: REG-GA-001, article: 第3条 }
  contacts:
    - { contact: GA-GENERAL, role: APPLY }
  keywords: [結婚, 婚姻, 入籍, 結婚祝い, ご祝儀, 祝い金]

- code: PRG-BIRTH-GIFT
  name: 出産祝金
  name_kana: しゅっさんいわいきん
  summary: 社員または配偶者が出産したときに支給されるお祝い金。
  eligibility: 勤続6か月以上の正社員・契約社員（パートタイム社員は半額）
  benefit: 子1人につき20,000円
  how_to_apply: 社内ポータルの「慶弔申請」から、出生を証明する書類を添付して申請する。
  deadline_note: 出生日から6か月以内
  required_documents: 出生届受理証明書または母子健康手帳の出生届出済証明の写し
  category: welfare-ceremony
  owner_department: GA
  visibility: INTERNAL
  basis:
    - { document: REG-GA-001, article: 第6条 }
  contacts:
    - { contact: GA-GENERAL, role: APPLY }
  keywords: [出産, 出生, 子供が生まれた, 赤ちゃん, 出産祝い]

- code: PRG-CONDOLENCE
  name: 弔慰金・供花
  name_kana: ちょういきん
  summary: 社員や家族が亡くなったときに支給される弔慰金と、会社名での供花の手配。
  eligibility: 社員（勤続期間にかかわらず支給）
  benefit: 本人100,000円、配偶者50,000円、子・父母30,000円、祖父母・兄弟姉妹・配偶者の父母10,000円
  how_to_apply: 社内ポータルの「慶弔申請」から申請する。供花は総務部 庶務グループに連絡する。
  deadline_note: 事由の発生日から6か月以内
  category: welfare-ceremony
  owner_department: GA
  visibility: INTERNAL
  basis:
    - { document: REG-GA-001, article: 第8条 }
    - { document: REG-GA-001, article: 第9条 }
  contacts:
    - { contact: GA-GENERAL, role: APPLY }
  keywords: [弔慰金, 香典, 葬儀, 葬式, 亡くなった, 死亡, 供花, 不幸]

- code: PRG-SICK-VISIT
  name: 傷病見舞金
  name_kana: しょうびょうみまいきん
  summary: 業務外の病気・けがで連続14日以上欠勤したときに支給される見舞金。
  eligibility: 勤続6か月以上の正社員・契約社員（パートタイム社員は半額）
  benefit: 10,000円
  how_to_apply: 社内ポータルの「慶弔申請」から申請する。
  deadline_note: 事由の発生日から6か月以内
  category: welfare-ceremony
  owner_department: GA
  visibility: INTERNAL
  basis:
    - { document: REG-GA-001, article: 第11条 }
  contacts:
    - { contact: GA-GENERAL, role: APPLY }
  keywords: [入院, 病気, けが, 怪我, 長期欠勤, 見舞金]

- code: PRG-DISASTER-AID
  name: 災害見舞金
  name_kana: さいがいみまいきん
  summary: 住居が火災・自然災害で被害を受けたときに支給される見舞金。
  eligibility: 勤続6か月以上の正社員・契約社員（パートタイム社員は半額）
  benefit: 全壊・全焼100,000円、半壊・半焼50,000円、一部損壊20,000円
  how_to_apply: 社内ポータルの「慶弔申請」から、被害を証明する書類（罹災証明書など）を添付して申請する。
  deadline_note: 事由の発生日から6か月以内
  required_documents: 罹災証明書など
  category: welfare-ceremony
  owner_department: GA
  visibility: INTERNAL
  basis:
    - { document: REG-GA-001, article: 第12条 }
  contacts:
    - { contact: GA-GENERAL, role: APPLY }
  keywords: [火事, 火災, 地震, 台風, 水害, 浸水, 被災, 災害]

