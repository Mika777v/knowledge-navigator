- code: PRG-HEALTH-CONSULTATION
  name: 健康相談（産業医・保健師）
  name_kana: けんこうそうだん
  summary: 心身の不調について産業医・保健師に相談できる。相談内容は本人の同意なく人事評価に使われない。
  eligibility: 全社員
  how_to_apply: 健康管理室にメールまたは内線で予約する。
  category: welfare
  owner_department: HR
  visibility: INTERNAL
  basis:
