    - { document: REG-HR-001, article: 第31条 }
  contacts:
    - { contact: HR-LABOR, role: APPLY }
  keywords: [産休, 産前休業, 産後休業, 妊娠, 出産, 母性健康管理]

- code: PRG-JUROR-LEAVE
  name: 裁判員休暇
  name_kana: さいばんいんきゅうか
  summary: 裁判員または裁判員候補者として裁判所に出頭するときの有給の休暇。
  eligibility: 全社員
  benefit: 必要な日数
  how_to_apply: 呼出状の写しを添えて、勤怠システムで申請する。
  category: hr-leave
  owner_department: HR
  visibility: INTERNAL
