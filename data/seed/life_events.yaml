# きっかけ（利用者の状況）。ホーム画面の「きっかけから探す」と、検索語からの案内に使う
# programs: relation が PRIMARY = まず確認する制度 / RELATED = あわせて必要になりやすい手続き
# keywords: この状況を表す言葉（検索語に含まれたら、このきっかけの制度を案内する）

- code: MARRIAGE
  name: 結婚
  icon: ring
  description: 結婚したとき・する予定のときに使える制度と、必要な手続き。
  keywords: [結婚, 婚姻, 入籍, 挙式, 結婚式, 新婚]
  programs:
    - { program: PRG-MARRIAGE-GIFT, relation: PRIMARY }
    - { program: PRG-MARRIAGE-LEAVE, relation: PRIMARY }
    - { program: PRG-PERSONAL-INFO-CHANGE, relation: RELATED }
    - { program: PRG-COMMUTE-ALLOWANCE, relation: RELATED }
    - { program: PRG-HOUSING-ALLOWANCE, relation: RELATED }

- code: BIRTH
  name: 出産・育児
  icon: baby
  description: 本人または配偶者の出産と、子育てと仕事の両立に使える制度。
  keywords: [出産, 妊娠, 子供が生まれる, 子どもが生まれる, 赤ちゃん, 育児, 子育て, 産休, 育休]
  programs:
    - { program: PRG-BIRTH-GIFT, relation: PRIMARY }
    - { program: PRG-MATERNITY-LEAVE, relation: PRIMARY }
    - { program: PRG-SPOUSE-BIRTH-LEAVE, relation: PRIMARY }
    - { program: PRG-CHILDCARE-LEAVE, relation: PRIMARY }
    - { program: PRG-PATERNITY-LEAVE, relation: PRIMARY }
    - { program: PRG-CHILD-NURSING-LEAVE, relation: PRIMARY }
    - { program: PRG-CHILDCARE-SHORT-HOURS, relation: PRIMARY }
    - { program: PRG-OVERTIME-EXEMPTION, relation: RELATED }
    - { program: PRG-FLEXIBLE-WORK-CHILDCARE, relation: RELATED }
    - { program: PRG-CARE-SERVICE-AID, relation: RELATED }
    - { program: PRG-PERSONAL-INFO-CHANGE, relation: RELATED }

