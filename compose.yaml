# ローカル開発・デモ用の構成。
# 使い方は README.md の「ローカルで動かす」または `make help` を参照。

name: knowledge-navigator

services:
  postgres:
    build: ./infra/docker/postgres
    image: ${POSTGRES_IMAGE:-knowledge-navigator/postgres:local}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # PostgreSQL 17 の builtin ロケール（OS の glibc 更新で並び順が変わらない）
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    image: knowledge-navigator/backend:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # make seed でデモユーザーに設定するパスワード
      KNAVI_SEED_DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      # 検索ログのユーザー ID を仮名化する鍵（未設定ならローカル用の既定値）
      KNAVI_USER_HASH_SECRET: ${KNAVI_USER_HASH_SECRET:-local-dev-only-change-me}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: knowledge-navigator/frontend:local
    environment:
      # BFF（/api/*）の転送先。compose 内のサービス名で backend を指す
      BACKEND_URL: http://backend:8080
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
