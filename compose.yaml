# ローカル開発・デモ用の構成。
# 使い方は README.md の「ローカルで動かす」または `make help` を参照。

name: knowledge-navigator

services:
  postgres:
    build: ./infra/docker/postgres
    image: ${POSTGRES_IMAGE:-knowledge-navigator/postgres:local}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # PostgreSQL 17 の builtin ロケール（OS の glibc 更新で並び順が変わらない）
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  storage:
    # 原本ファイル（PDF）の置き場所。S3 互換の SeaweedFS（ADR-0010）
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0", "-volume.max=0"]
    environment:
      # S3 API の認証情報（.env の STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY。古い .env でも動くよう既定値を持つ）
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-knavi}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-knavi_local_only}
    ports:
      - "127.0.0.1:${STORAGE_PORT:-8333}:8333"
    volumes:
      - storage:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    image: knowledge-navigator/backend:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # make seed でデモユーザーに設定するパスワード
      KNAVI_SEED_DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      # 検索ログのユーザー ID を仮名化する鍵（未設定ならローカル用の既定値）
      KNAVI_USER_HASH_SECRET: ${KNAVI_USER_HASH_SECRET:-local-dev-only-change-me}
      KNAVI_STORAGE_ENDPOINT: http://storage:8333
      KNAVI_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-knavi}
      KNAVI_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-knavi_local_only}
      KNAVI_STORAGE_CREATE_BUCKET: "true"
      # 意味検索（ADR-0006・0007）。make up-ai のときだけ true になる。ai-service がなくてもキーワード検索で動く
      KNAVI_SEARCH_VECTOR_ENABLED: ${KNAVI_SEARCH_VECTOR_ENABLED:-false}
      # ベクトルを合わせる間隔（ADR-0012）。make up-ai では 1 分にする
      KNAVI_EMBEDDING_SYNC_INTERVAL: ${KNAVI_EMBEDDING_SYNC_INTERVAL:-PT5M}
      # 似ていないものを除く値（ADR-0007）。評価で決める
      KNAVI_SEARCH_VECTOR_MIN_SIMILARITY: ${KNAVI_SEARCH_VECTOR_MIN_SIMILARITY:-0.5}
      KNAVI_AI_BASE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-dev-only-change-me}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # AI の処理（ADR-0006）。`docker compose --profile ai up`（make up-ai）のときだけ起動する
  ai-service:
    profiles: ["ai"]
    build: ./ai-service
    image: knowledge-navigator/ai-service:local
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-dev-only-change-me}
      # プロバイダ（ADR-0008）。既定はローカルの Ollama。OpenAI・Azure に替えるときは .env で指定する
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      OLLAMA_BASE_URL: http://ollama:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
    # ホストには出さない。backend からだけ http://ai-service:8000 で呼ぶ
    expose:
      - "8000"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  # ローカルの LLM・Embedding（ADR-0008）。文章を社外に送らない。GPU なし（CPU）で動く
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.40.3
    volumes:
      - ollama:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Embedding のモデルを取り寄せる（初回だけ時間がかかる。bge-m3 で約 1.2GB。取り寄せたものは ollama ボリュームに残る）
  ollama-pull:
    profiles: ["ai"]
    image: ollama/ollama:0.40.3
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL:-bge-m3}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  frontend:
    build: ./frontend
    image: knowledge-navigator/frontend:local
    environment:
      # BFF（/api/*）の転送先。compose 内のサービス名で backend を指す
      BACKEND_URL: http://backend:8080
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  ollama:
