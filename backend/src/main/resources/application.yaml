spring:
  application:
    name: knowledge-navigator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:knavi}}
    username: ${POSTGRES_USER:knavi}
    password: ${POSTGRES_PASSWORD:knavi_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Tokyo
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # アップロードの上限（knavi.storage.max-upload-bytes と合わせる）。超えると 413
      max-file-size: 20MB
      max-request-size: 21MB

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # 本番（HTTPS）では true にする
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

knavi:
  text:
    sudachi:
      # 形態素解析の辞書（ファイル、または .dic を1つ含むフォルダ。ADR-0011）。空なら表記ゆれの吸収なしで検索する
      dictionary: ${KNAVI_SUDACHI_DICTIONARY:}
  storage:
    # 原本ファイルの置き場所（S3 互換。ローカルは compose の SeaweedFS。ADR-0010）
    endpoint: ${KNAVI_STORAGE_ENDPOINT:http://localhost:8333}
    region: ${KNAVI_STORAGE_REGION:us-east-1}
    bucket: ${KNAVI_STORAGE_BUCKET:knavi-files}
    access-key: ${KNAVI_STORAGE_ACCESS_KEY:knavi}
    secret-key: ${KNAVI_STORAGE_SECRET_KEY:knavi_local_only}
    # SeaweedFS・MinIO などは path-style（http://host/bucket/key）で呼ぶ
    path-style: true
    # 起動時にバケットが無ければ作る（ローカル・CI 用。本番はインフラ側で作る）
    create-bucket: ${KNAVI_STORAGE_CREATE_BUCKET:false}
    max-upload-bytes: 20971520
  seed:
    # make seed で true にする（通常の起動では投入しない）
    enabled: false
    path: ../data/seed
    demo-user-password: ${KNAVI_SEED_DEMO_USER_PASSWORD:}
  insight:
    # 検索ログのユーザー ID を仮名化する HMAC の鍵。本番では必ず KNAVI_USER_HASH_SECRET を設定する
    user-hash-secret: ${KNAVI_USER_HASH_SECRET:local-dev-only-change-me}
    # 分析で質問ごとの集計を出す最低の利用者数（1人だけの検索は個人の履歴になるため出さない）
    min-distinct-users: 2
    # 検索ログ（クリック・フィードバックを含む）の保存期間。過ぎたものは毎日 3:17（日本時間）に削除する
    retention-days: 180
  navigation:
    # 検索スコアの重み（docs/ARCHITECTURE.md §4.3）。data/eval の評価結果を見て調整する
    weights:
      dictionary: 3.0
      program-name: 2.5
      faq-question: 2.0
      heading: 1.5
      body: 1.0
      basis: 0.5
      linked-faq: 0.3
      min-relative-score: 0.2
      keyword-stem: 0.7
      synonym: 0.8
