spring:
  application:
    name: knowledge-navigator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:knavi}}
    username: ${POSTGRES_USER:knavi}
    password: ${POSTGRES_PASSWORD:knavi_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Tokyo
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # アップロードの上限（knavi.storage.max-upload-bytes と合わせる）。超えると 413
      max-file-size: 20MB
      max-request-size: 21MB

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # 本番（HTTPS）では true にする
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

knavi:
  text:
    sudachi:
      # 形態素解析の辞書（ファイル、または .dic を1つ含むフォルダ。ADR-0011）。空なら表記ゆれの吸収なしで検索する
      dictionary: ${KNAVI_SUDACHI_DICTIONARY:}
  storage:
    # 原本ファイルの置き場所（S3 互換。ローカルは compose の SeaweedFS。ADR-0010）
    endpoint: ${KNAVI_STORAGE_ENDPOINT:http://localhost:8333}
    region: ${KNAVI_STORAGE_REGION:us-east-1}
    bucket: ${KNAVI_STORAGE_BUCKET:knavi-files}
    access-key: ${KNAVI_STORAGE_ACCESS_KEY:knavi}
    secret-key: ${KNAVI_STORAGE_SECRET_KEY:knavi_local_only}
    # SeaweedFS・MinIO などは path-style（http://host/bucket/key）で呼ぶ
    path-style: true
    # 起動時にバケットが無ければ作る（ローカル・CI 用。本番はインフラ側で作る）
    create-bucket: ${KNAVI_STORAGE_CREATE_BUCKET:false}
    max-upload-bytes: 20971520
  seed:
    # make seed で true にする（通常の起動では投入しない）
    enabled: false
    path: ../data/seed
    demo-user-password: ${KNAVI_SEED_DEMO_USER_PASSWORD:}
  insight:
    # 検索ログのユーザー ID を仮名化する HMAC の鍵。本番では必ず KNAVI_USER_HASH_SECRET を設定する
    user-hash-secret: ${KNAVI_USER_HASH_SECRET:local-dev-only-change-me}
    # 分析で質問ごとの集計を出す最低の利用者数（1人だけの検索は個人の履歴になるため出さない）
    min-distinct-users: 2
    # 検索ログ（クリック・フィードバックを含む）の保存期間。過ぎたものは毎日 3:17（日本時間）に削除する
    retention-days: 180
  search:
    vector:
      # 意味検索（ベクトル検索）のオン・オフ（ADR-0007）。オフならベクトルの合わせも動かさない。make up-ai でオンにする
      enabled: ${KNAVI_SEARCH_VECTOR_ENABLED:false}
      # ブロック（制度・条・FAQ）ごとに取り出すベクトル検索の上位の数（ADR-0007）
      limit: 50
      # これより似ていない（コサイン類似度が低い）ものは出さない。data/eval の評価で決める
      min-similarity: 0.5
  ai:
    # ai-service（ADR-0006）。compose では http://ai-service:8000
    base-url: ${KNAVI_AI_BASE_URL:http://localhost:8000}
    # ai-service との共有のトークン。本番では必ず AI_SERVICE_TOKEN を設定する
    token: ${AI_SERVICE_TOKEN:local-dev-only-change-me}
    connect-timeout: 2s
    read-timeout: 60s
    # 検索の質問をベクトルにするのを待つ時間。過ぎたらキーワード検索だけで返す
    query-timeout: 2s
    # 回答文の生成を待つ時間（ADR-0013）。ai-service はこれより短い 110 秒で打ち切る
    answer-timeout: 120s
    # 社外に送るプロバイダ（OpenAI など）のとき、ベクトルにする・回答の文脈に入れてよい公開範囲
    # （ADR-0008。CONFIDENTIAL は指定しても送らない）
    external-visibilities: INTERNAL
  assistant:
    # 根拠付き回答（ADR-0013）。ai-service（make up-ai）を動かしているときだけ true にする。false なら4ブロックの結果だけ返す
    enabled: ${KNAVI_ASSISTANT_ENABLED:false}
    # 回答の文脈に入れる条の数の上限（検索の上位から）
    max-passages: 6
    # 会話の履歴の保持期間（ADR-0014）。最後に話した日から数え、過ぎた会話は毎日 3:23（日本時間）に削除する
    retention-days: ${KNAVI_ASSISTANT_RETENTION_DAYS:90}
  embedding:
    # 「今あるべきベクトル」と embeddings 表を見比べる間隔（ADR-0012）
    sync-interval: PT5M
    # 1回に ai-service へ送る文章の数（ai-service の上限 64 以下）
    batch-size: 32
  navigation:
    # 検索スコアの重み（docs/ARCHITECTURE.md §4.3）。data/eval の評価結果を見て調整する
    weights:
      dictionary: 3.0
      program-name: 2.5
      faq-question: 2.0
      heading: 1.5
      body: 1.0
      basis: 0.5
      linked-faq: 0.3
      min-relative-score: 0.2
      keyword-stem: 0.7
      synonym: 0.8
