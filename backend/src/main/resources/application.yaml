spring:
  application:
    name: knowledge-navigator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:knavi}}
    username: ${POSTGRES_USER:knavi}
    password: ${POSTGRES_PASSWORD:knavi_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Tokyo
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # 本番（HTTPS）では true にする
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

knavi:
  seed:
    # make seed で true にする（通常の起動では投入しない）
    enabled: false
    path: ../data/seed
    demo-user-password: ${KNAVI_SEED_DEMO_USER_PASSWORD:}
  navigation:
    # 検索スコアの重み（docs/ARCHITECTURE.md §4.3）。data/eval の評価結果を見て調整する
    weights:
      dictionary: 3.0
      program-name: 2.5
      faq-question: 2.0
      heading: 1.5
      body: 1.0
      basis: 0.5
      linked-faq: 0.3
      min-relative-score: 0.2
