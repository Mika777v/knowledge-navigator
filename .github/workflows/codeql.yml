name: codeql

# CodeQL によるコードの脆弱性スキャン（E16-T1）。結果はリポジトリの Security タブ（Code scanning）と PR の注釈に出る。
# 必須チェック（ci-ok）には含めない。見つかった問題は Security タブで確認し、Issue にして直す
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/codeql.yml
  schedule:
    # 毎週月曜 12:23（日本時間）。新しく追加された検査ルールでも定期的に見直す
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # ビルドせずにソースを解析する（Java は Gradle のビルドを待たずに済む）
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # 標準より広い security-extended のルールで検査する
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
