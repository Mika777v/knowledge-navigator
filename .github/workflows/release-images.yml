name: release-images

# リリースのタグ（v0.2.0 など）を作ったら、backend・frontend・postgres・ai-service のイメージを
# GitHub Container Registry（ghcr.io）に公開する（E16-T2）。タグは release-please.yml が作り、ここを直接呼ぶ。
# GitHub の画面の Release から手でタグを作ったときは、タグの push で動く。
# 公開したイメージは、ghcr.io/<owner>/knowledge-navigator-<サービス>:<版> で取得できる
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: 公開する版のタグ（v0.7.0 など）
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            description: 社内規程ナビの backend（Spring Boot）
          - service: frontend
            context: ./frontend
            description: 社内規程ナビの frontend（Next.js）
          - service: postgres
            context: ./infra/docker/postgres
            description: 社内規程ナビ用の PostgreSQL（pg_bigm・pgvector 入り）
          - service: caddy
            context: ./infra/docker/caddy
            description: 社内規程ナビのデモ環境の入口（Caddy。Route 53 で証明書を取るモジュール入り。ADR-0015）
          - service: ai-service
            context: ./ai-service
            description: 社内規程ナビの ai-service（FastAPI。Embedding。DB には接続しない）
    steps:
      - uses: actions/checkout@v7
        with:
          # release-please.yml から呼ばれたときは main の push が起点なので、タグを明示して取り出す
          ref: ${{ inputs.tag || github.ref }}
      - name: Image name
        id: image
        # ghcr.io のイメージ名は小文字だけ
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/knowledge-navigator-${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      # サードパーティの action は、タグの付け替えに影響されないようコミットのハッシュで固定する
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # v0.2.0 → 0.2.0・0.2・latest
          tags: |
            type=semver,pattern={{version}},value=${{ steps.image.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.image.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
