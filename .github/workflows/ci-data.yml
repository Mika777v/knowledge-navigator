name: ci-data

# ci.yml（ゲート）から、関係するファイルが変わったときだけ呼ばれる。手動実行も可
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/data/validate_seed.py
