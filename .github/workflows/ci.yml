name: ci

# すべての PR と main への push で動くゲート。
# 変更されたファイルに応じて各 CI（再利用ワークフロー）を呼び、最後の ci-ok ジョブで結果をまとめる。
# main の必須チェックは ci-ok と pr-title（conventional-commits）の2つだけにする（scripts/github/setup-repo.sh）。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      db: ${{ steps.filter.outputs.db }}
      compose: ${{ steps.filter.outputs.compose }}
      data: ${{ steps.filter.outputs.data }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # ci.yml 自体の変更では全 CI を実行する
          filters: |
            gate: &gate
              - .github/workflows/ci.yml
            backend:
              - *gate
              - backend/**
              - infra/docker/postgres/**
              - .github/workflows/ci-backend.yml
              # backend の CI で API との一致を確かめる
              - frontend/src/lib/api/schema.d.ts
            frontend:
              - *gate
              - frontend/**
              - .github/workflows/ci-frontend.yml
            db:
              - *gate
              - infra/docker/postgres/**
              - .github/workflows/ci-db.yml
            compose:
              - *gate
              - compose.yaml
              - .env.example
              - Makefile
              - backend/**
              - frontend/**
              - infra/docker/postgres/**
              # ダミーデータと評価セットが変わると検索品質の評価結果も変わる
              - data/**
              - scripts/eval/**
              - .github/workflows/ci-compose.yml
            ai-service:
              - *gate
              - ai-service/**
              - .github/workflows/ci-ai-service.yml
            data:
              - *gate
              - data/**
              - scripts/data/**
              - scripts/eval/**
              - .github/workflows/ci-data.yml
            terraform:
              - *gate
              - infra/terraform/**
              - .github/workflows/ci-terraform.yml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml

  db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    uses: ./.github/workflows/ci-db.yml

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    uses: ./.github/workflows/ci-compose.yml

  data:
    needs: changes
    if: needs.changes.outputs.data == 'true'
    uses: ./.github/workflows/ci-data.yml

  ai-service:
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    uses: ./.github/workflows/ci-ai-service.yml

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    uses: ./.github/workflows/ci-terraform.yml

  # 必須チェック。スキップされた CI は成功扱い、失敗・キャンセルがあれば失敗にする
  ci-ok:
    if: always()
    needs: [changes, backend, frontend, db, compose, data, ai-service, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::いずれかの CI が失敗またはキャンセルされました"
            exit 1
          fi
