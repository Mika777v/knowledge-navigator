name: ci-terraform

# デモ環境の AWS 構成（infra/terraform/demo。ADR-0015）の検査。AWS には接続しない。
# 書式（fmt）・文法と型（validate）・セキュリティの設定（Trivy の config スキャン。HIGH 以上で失敗）
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/demo
    steps:
      - uses: actions/checkout@v7
      # サードパーティの action は、タグの付け替えに影響されないようコミットのハッシュで固定する
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate
      - name: Trivy（設定の検査）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform/demo
          severity: CRITICAL,HIGH
          exit-code: "1"
