name: ci-compose

# `make up` で全サービスが起動し、連携できることを確認する
# ci.yml（ゲート）から、関係するファイルが変わったときだけ呼ばれる。手動実行も可
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start all services
        run: make up
      - name: Check database settings
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < infra/docker/postgres/test/compose-check.sql
      - name: Check backend health
        run: curl -fsS http://localhost:8080/actuator/health | tee /dev/stderr | grep -q '"status":"UP"'
      - name: Load seed data
        run: make seed
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Search quality evaluation (search-eval)
        # 評価用質問（data/eval）で検索品質を測り、結果をジョブのサマリーに出す。
        # Hit@5 が目標（85%）を下回ったら失敗、基準値（data/eval/baseline.json）より悪化したら警告にする
        run: |
          pip install pyyaml
          python scripts/eval/run_eval.py
      - name: Paraphrase evaluation (search-eval-paraphrase)
        # 言い換えの質問（data/eval/paraphrase.yaml）の成績をサマリーに出す。意味検索の効果を見るためのもので、失敗にはしない
        if: ${{ !cancelled() }}
        run: python scripts/eval/run_eval.py --questions data/eval/paraphrase.yaml --baseline data/eval/baseline-paraphrase.json --output build/eval-paraphrase --min-hit5 0
      - name: Save the search-eval report for the PR comment
        # 結果は search-eval-comment.yml が PR にコメントする（このジョブには書き込み権限を渡さない）
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('build/eval/report.md') != '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > build/eval/pr-number.txt
      - name: Upload the search-eval report
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('build/eval/report.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: search-eval
          path: |
            build/eval/report.md
            build/eval/pr-number.txt
          retention-days: 7
      - name: Log in as a demo user through the BFF
        run: |
          jar="$RUNNER_TEMP/cookies.txt"
          curl -fsS -c "$jar" -b "$jar" http://localhost:3000/api/v1/auth/csrf > /dev/null
          token=$(awk '$6 == "XSRF-TOKEN" { print $7 }' "$jar")
          password=$(grep '^DEMO_USER_PASSWORD=' .env | cut -d= -f2)
          curl -fsS -c "$jar" -b "$jar" -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            -d "{\"email\":\"sato@example.com\",\"password\":\"$password\"}" \
            http://localhost:3000/api/v1/auth/login > /dev/null
          curl -fsS -b "$jar" http://localhost:3000/api/v1/me | tee /dev/stderr | grep -q '"email":"sato@example.com"'
      - name: Check frontend and BFF
        run: |
          curl -fsS http://localhost:3000/api/health | tee /dev/stderr | grep -q '"backend":"UP"'
          # 未ログインならログイン画面へ移動させ、ログイン済みならホームを表示する
          curl -fsS -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost:3000/ | tee /dev/stderr \
            | grep -q '^307 .*/login?next=%2F$'
          curl -fsS http://localhost:3000/login | grep -q 'ログイン'
          # セキュリティヘッダー（frontend/src/lib/security-headers.ts）
          headers=$(curl -fsS -D - -o /dev/null http://localhost:3000/login)
          echo "$headers" | grep -qi "^content-security-policy: .*frame-ancestors 'none'"
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          ! echo "$headers" | grep -qi '^x-powered-by'
          curl -fsS -b "$RUNNER_TEMP/cookies.txt" http://localhost:3000/ | grep -q '社内規程ナビ'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: E2E tests (Playwright)
        # ブラウザで画面を操作し、ログイン・検索・条文・フィードバック・管理画面の流れを確かめる
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          DEMO_USER_PASSWORD=$(grep '^DEMO_USER_PASSWORD=' ../.env | cut -d= -f2) pnpm e2e
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: make clean

  # デモ環境（ADR-0015）の compose.demo.yaml が起動し、Caddy の HTTPS 経由でログインできるかを確かめる。
  # RDS・S3 の代わりに postgres・SeaweedFS のコンテナにつなぎ（compose.demo.ci.yaml）、イメージはここでビルドしたものを使う
  demo-compose:
    runs-on: ubuntu-latest
    env:
      KNAVI_COMPOSE_FILES: -f compose.demo.yaml -f compose.demo.ci.yaml
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          cp .env.example .env
          docker compose build postgres backend frontend
          docker build -t knowledge-navigator/caddy:local infra/docker/caddy
      - name: Write .env.demo
        run: |
          cat > .env.demo <<'ENV'
          KNAVI_VERSION=ci
          KNAVI_CADDY_IMAGE=knowledge-navigator/caddy:local
          KNAVI_FRONTEND_IMAGE=knowledge-navigator/frontend:local
          KNAVI_BACKEND_IMAGE=knowledge-navigator/backend:local
          KNAVI_POSTGRES_IMAGE=knowledge-navigator/postgres:local
          KNAVI_SITE=localhost
          KNAVI_TLS_MODE=internal
          DB_HOST=postgres
          DB_SSLMODE=disable
          POSTGRES_PASSWORD=ci-only-db
          KNAVI_USER_HASH_SECRET=ci-only-hash
          DEMO_USER_PASSWORD=ci-only-demo
          KNAVI_STORAGE_ENDPOINT=http://storage:8333
          KNAVI_STORAGE_ACCESS_KEY=knavi
          KNAVI_STORAGE_SECRET_KEY=ci-only-storage
          KNAVI_STORAGE_PATH_STYLE=true
          KNAVI_STORAGE_CREATE_BUCKET=true
          KNAVI_STORAGE_BUCKET=knavi-files
          ENV
      - name: Start the demo services
        run: docker compose $KNAVI_COMPOSE_FILES --env-file .env.demo up -d --wait
      - name: Reset and load seed data (scripts/demo/reset.sh)
        run: scripts/demo/reset.sh
      - name: Only Caddy's 443 is published
        run: |
          ! curl -sS --max-time 3 http://localhost:3000/ 2>/dev/null
          ! curl -sS --max-time 3 http://localhost:8080/ 2>/dev/null
          ! curl -sS --max-time 3 http://localhost/ 2>/dev/null
      - name: Log in through Caddy (HTTPS)
        run: |
          base=https://localhost
          jar="$RUNNER_TEMP/cookies.txt"
          curl -kfsS "$base/api/health" | tee /dev/stderr | grep -q '"backend":"UP"'
          curl -kfsS -c "$jar" -b "$jar" "$base/api/v1/auth/csrf" > /dev/null
          token=$(awk '$6 == "XSRF-TOKEN" { print $7 }' "$jar")
          curl -kfsS -c "$jar" -b "$jar" -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            -d '{"email":"sato@example.com","password":"ci-only-demo"}' "$base/api/v1/auth/login" > /dev/null
          curl -kfsS -b "$jar" "$base/api/v1/me" | tee /dev/stderr | grep -q '"email":"sato@example.com"'
          curl -kfsS -b "$jar" "$base/" | grep -q '社内規程ナビ'
      - name: Reset twice (the daily cron runs it on a running environment)
        run: scripts/demo/reset.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose $KNAVI_COMPOSE_FILES --env-file .env.demo logs
      - name: Stop services
        if: always()
        run: docker compose $KNAVI_COMPOSE_FILES --env-file .env.demo down -v
