name: ci-compose

# `make up` で全サービスが起動し、連携できることを確認する
# ci.yml（ゲート）から、関係するファイルが変わったときだけ呼ばれる。手動実行も可
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start all services
        run: make up
      - name: Check database settings
        run: |
          docker compose exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < infra/docker/postgres/test/compose-check.sql
      - name: Check backend health
        run: curl -fsS http://localhost:8080/actuator/health | tee /dev/stderr | grep -q '"status":"UP"'
      - name: Load seed data
        run: make seed
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Search quality evaluation (search-eval)
        # 評価用質問（data/eval）で検索品質を測り、結果をジョブのサマリーに出す。
        # Hit@5 が目標（70%）を下回ったら失敗、基準値（data/eval/baseline.json）より悪化したら警告にする
        run: |
          pip install pyyaml
          python scripts/eval/run_eval.py
      - name: Log in as a demo user through the BFF
        run: |
          jar="$RUNNER_TEMP/cookies.txt"
          curl -fsS -c "$jar" -b "$jar" http://localhost:3000/api/v1/auth/csrf > /dev/null
          token=$(awk '$6 == "XSRF-TOKEN" { print $7 }' "$jar")
          password=$(grep '^DEMO_USER_PASSWORD=' .env | cut -d= -f2)
          curl -fsS -c "$jar" -b "$jar" -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            -d "{\"email\":\"sato@example.com\",\"password\":\"$password\"}" \
            http://localhost:3000/api/v1/auth/login > /dev/null
          curl -fsS -b "$jar" http://localhost:3000/api/v1/me | tee /dev/stderr | grep -q '"email":"sato@example.com"'
      - name: Check frontend and BFF
        run: |
          curl -fsS http://localhost:3000/api/health | tee /dev/stderr | grep -q '"backend":"UP"'
          # 未ログインならログイン画面へ移動させ、ログイン済みならホームを表示する
          curl -fsS -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost:3000/ | tee /dev/stderr \
            | grep -q '^307 .*/login?next=%2F$'
          curl -fsS http://localhost:3000/login | grep -q 'ログイン'
          curl -fsS -b "$RUNNER_TEMP/cookies.txt" http://localhost:3000/ | grep -q '社内規程ナビ'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: make clean
