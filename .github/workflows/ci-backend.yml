name: ci-backend

# ci.yml（ゲート）から、関係するファイルが変わったときだけ呼ばれる。手動実行も可
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # 結合テスト（Testcontainers）で使う DB イメージ
      - name: Build PostgreSQL image
        working-directory: .
        run: docker build -t knowledge-navigator/postgres:local infra/docker/postgres
      - name: Build and test
        run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/
      - name: Build container image
        run: docker build -t knowledge-navigator/backend:ci .
