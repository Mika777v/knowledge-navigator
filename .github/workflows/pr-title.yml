name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            search
            revert
          scopes: |
            backend
            frontend
            ai
            ingest
            db
            search
            auth
            infra
            docs
            seed
            deps
          requireScope: false
          # 日本語の subject を許可するため、大文字小文字の規則は課さない
          subjectPattern: ^.+$
