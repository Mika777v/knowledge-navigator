# backend(gradle) / frontend(npm) / ai-service(uv) は各ディレクトリ作成時に追加する
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: ["area:infra", "dependencies"]

  - package-ecosystem: docker
    directory: /infra/docker/postgres
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: ["area:db", "dependencies"]

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: ["area:backend", "dependencies"]
    groups:
      spring:
        patterns: ["org.springframework*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels: ["area:backend", "dependencies"]
