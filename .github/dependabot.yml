version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 公開から2週間以上たった版だけを提案させる（CLAUDE.md）
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
    labels: ["area:infra", "dependencies"]

  - package-ecosystem: docker
    directory: /infra/docker/postgres
    schedule:
      interval: weekly
    # 公開から2週間以上たった版だけを提案させる（CLAUDE.md）
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: ["area:db", "dependencies"]

  - package-ecosystem: docker
    directory: /infra/docker/caddy
    schedule:
      interval: weekly
    # 公開から2週間以上たった版だけを提案させる（CLAUDE.md）
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: ["area:infra", "dependencies"]

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    # 公開から2週間以上たった版だけを提案させる（CLAUDE.md）
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: ["area:backend", "dependencies"]
    groups:
      spring:
        patterns: ["org.springframework*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # 公開から2週間以上たった版だけを提案させる（CLAUDE.md）
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: ["area:backend", "dependencies"]
    ignore:
      # Java は LTS（21）に固定する。次の LTS へ上げるときは手動で行う
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # 公開から2週間以上たった版だけを提案させる（CLAUDE.md）
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: ["area:frontend", "dependencies"]
    ignore:
      # @types/node は実行環境の Node.js（22 の LTS。Dockerfile・CI）と同じメジャー版に合わせる。Node.js を上げるときに手動で上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      test:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom", "@vitejs/*", "@playwright/*"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    # 公開から2週間以上たった版だけを提案させる（CLAUDE.md）
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: ["area:frontend", "dependencies"]
    ignore:
      # Node.js は LTS（22）に固定する。次の LTS へ上げるときは手動で行う
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /ai-service
    schedule:
      interval: weekly
    # 公開から2週間以上たった版だけを提案させる（CLAUDE.md）
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: ["area:ai", "dependencies"]

  - package-ecosystem: docker
    directory: /ai-service
    schedule:
      interval: weekly
    # 公開から2週間以上たった版だけを提案させる（CLAUDE.md）
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: ["area:ai", "dependencies"]
    ignore:
      # Python は 3.12 に固定する（pyproject.toml の requires-python と合わせる）。上げるときは手動で行う
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: terraform
    directory: /infra/terraform/demo
    schedule:
      interval: weekly
    # 公開から2週間以上たった版だけを提案させる（CLAUDE.md）
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    labels: ["area:infra", "dependencies"]
