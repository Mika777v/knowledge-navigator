name: Epic
description: 複数の Story / Task をまとめる大きな単位（子は Sub-issues で紐づける）
title: "[Epic] "
labels: ["type:epic"]
body:
  - type: input
    id: epic_id
    attributes:
      label: Epic ID
      placeholder: E07
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: ゴール
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: ["0", "1", "2", "3", "4", "5", "6"]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: スコープ / 対象外
  - type: textarea
    id: refs
    attributes:
      label: 参考
      placeholder: docs/TASKS.md
