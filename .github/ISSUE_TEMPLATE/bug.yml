name: Bug
description: 不具合の報告
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 環境
      placeholder: "commit SHA / ブラウザ / ログインロール"
  - type: textarea
    id: logs
    attributes:
      label: ログ・スクリーンショット
      description: 実在の社内情報・個人情報を含めないでください
      render: text
