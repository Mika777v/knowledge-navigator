name: Spike
description: 技術検証（結果は ADR か Issue コメントに記録し、コードはマージしない）
title: "[Spike] "
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: 判断したい問い
      placeholder: 例) OpenSearch(kuromoji) は pg_bigm より評価セットの Hit@5 が高いか
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: タイムボックス
      placeholder: 例) 1日
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 判断基準
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 成果物
      value: |
        - [ ] docs/adr/XXXX-*.md
